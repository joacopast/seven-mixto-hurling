services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seven_mixto
    ports:
      - "5432:5432"
    volumes:
      - seven_mixto_pg:/var/lib/postgresql/data

volumes:
  seven_mixto_pg:
